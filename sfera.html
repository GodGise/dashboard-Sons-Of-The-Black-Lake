  for(const pass of [0,1]){ctx.lineWidth=pass?1.1:.8;ctx.strokeStyle=pass?'rgba(255,225,150,.55)':'rgba(255,190,80,.32)';ctx.beginPath();
    for(const [p,tg,l,r] of STREAK){if((r<.45)!==!!pass)continue;const a=pr(p),b=pr([p[0]+tg[0]*l,p[1]+tg[1]*l,p[2]+tg[2]*l]);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}ctx.stroke()}
  // sinapsi (archi tra i nuclei)
  for(const l of L){if(!l.a.on||!l.b.on)continue;const hot=foc&&(l.a===foc||l.b===foc);if(foc&&!hot&&l.w<maxW*.3)continue;
    const w=l.w/maxW,al=hot?.95:foc?.07:.06+.3*w;ctx.strokeStyle=hot?rgba('#fff3c8',al):rgba('#ffb52e',al);ctx.lineWidth=hot?1.4+w*2.6:.5+w*1.6;
    const A=l.a.q3,B=l.b.q3,m=[(A[0]+B[0])/2*1.25,(A[1]+B[1])/2*1.25,(A[2]+B[2])/2*1.25];
    const at=u=>{const v=1-u;return pr([v*v*A[0]+2*v*u*m[0]+u*u*B[0],v*v*A[1]+2*v*u*m[1]+u*u*B[1],v*v*A[2]+2*v*u*m[2]+u*u*B[2]])};
    ctx.beginPath();for(let i=0;i<=20;i++){const z=at(i/20);i?ctx.lineTo(z[0],z[1]):ctx.moveTo(z[0],z[1])}ctx.stroke();
    if(!reduce&&(hot||(!foc&&w>.25))){const z=at((t*.22+l.w*.37)%1);ctx.fillStyle='#fff6d6';ctx.beginPath();ctx.arc(z[0],z[1],hot?2.8:2,0,6.283);ctx.fill()}}
  // elementi di codice: il centro e' piu' denso e piu' caldo
  for(const p of P){const c=C[p[3]];if(!c.on)continue;const q=pr(p),dim=foc&&!near.has(c.id),front=q[2]>-.1,hotc=p[5];
    ctx.globalAlpha=(dim?.1:front?1:.35)*Math.min(1,.5+q[3]*.4)*(.55+.45*hotc);ctx.fillStyle=hotc>.72?'#fff0c0':REG[c.r].k;const z=p[4]*q[3]*(c===foc?1.25:1)*(1+hotc*.5);ctx.fillRect(q[0]-z/2,q[1]-z/2,z,z)}
  ctx.globalAlpha=1;
  // cuore: anelli piccoli e bagliore
  const cg=ctx.createRadialGradient(CX,CY,0,CX,CY,150*zoom);cg.addColorStop(0,'rgba(255,225,150,.5)');cg.addColorStop(.4,'rgba(255,170,50,.14)');cg.addColorStop(1,'rgba(255,170,50,0)');ctx.fillStyle=cg;ctx.fillRect(0,0,CW,CH);
  for(let k=0;k<4;k++){const rr=.05+k*.045,tl=k*.7+.3,ph=reduce?0:t*(.9-k*.2);ctx.strokeStyle=rgba('#fff3c8',.75-k*.12);ctx.lineWidth=1.5;ctx.beginPath();
    for(let i=0;i<=60;i++){const a=i/60*5.2+ph,x=Math.cos(a)*rr,zz=Math.sin(a)*rr;const q=pr([x,-zz*Math.sin(tl),zz*Math.cos(tl)]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}ctx.stroke()}
  // nuclei
  for(const c of C){if(!c.on)continue;const q=pr(c.q3),dim=foc&&!near.has(c.id),front=q[2]>-.25;c._q=q;
    const r=(2.6+Math.sqrt(c.s)*.42)*q[3]*(c===foc?1.4:1),al=dim?.12:front?1:.35;
    const gg=ctx.createRadialGradient(q[0],q[1],0,q[0],q[1],r*4);gg.addColorStop(0,rgba(REG[c.r].k,.85*al));gg.addColorStop(.25,rgba(REG[c.r].k,.25*al));gg.addColorStop(1,rgba(REG[c.r].k,0));
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(q[0],q[1],r*4,0,6.283);ctx.fill();
    ctx.fillStyle=rgba('#fff8e0',al);ctx.beginPath();ctx.arc(q[0],q[1],r*.55,0,6.283);ctx.fill();
    if(c===foc||c===sel){ctx.strokeStyle=rgba('#fff3c8',.9);ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(q[0],q[1],r*1.9,0,6.283);ctx.stroke();ctx.beginPath();ctx.arc(q[0],q[1],r*2.6,t*2,t*2+4.2);ctx.stroke()}}
  ctx.globalCompositeOperation='source-over';
}
function loop(n){draw(n);requestAnimationFrame(loop)}
function fit(){const dpr=Math.min(devicePixelRatio||1,2),st=cv.parentElement,w=Math.max(200,Math.min(st.clientWidth,st.clientHeight*CW/CH));cv.style.width=w+'px';cv.style.height=(w*CH/CW)+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr*CH/CW)}
addEventListener('resize',()=>{fit();draw(performance.now())});
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*CW/r.width,(e.clientY-r.top)*CH/r.height,r]}
function pick(x,y){let b=null,bd=1e9;for(const c of C){if(!c.on||!c._q||c._q[2]<-.25)continue;const d=Math.hypot(c._q[0]-x,c._q[1]-y),rr=Math.max(14,(3.2+Math.sqrt(c.s)*.55)*c._q[3]*2.2);if(d<rr&&d<bd){bd=d;b=c}}return b}
const tip=document.getElementById('tip');
cv.addEventListener('pointerdown',e=>{drag=true;moved=0;[lx,ly]=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);cv.classList.add('dr')});
cv.addEventListener('pointermove',e=>{const[x,y,r]=pos(e);if(drag){const dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);yaw+=dx*.006;pitch=Math.max(-1.3,Math.min(1.3,pitch+dy*.006));[lx,ly]=[e.clientX,e.clientY];ty=null;tip.style.opacity=0;return}
  hover=pick(x,y);if(hover){tip.innerHTML=RN(hover.r)+'<small>'+hover.s+' '+T('elementi di codice')+'</small>';tip.style.left=(cv.offsetLeft+hover._q[0]*r.width/CW)+'px';tip.style.top=(cv.offsetTop+hover._q[1]*r.height/CH)+'px';tip.style.opacity=1}else tip.style.opacity=0});
cv.addEventListener('pointerup',e=>{drag=false;cv.classList.remove('dr');pause=performance.now()+2500;if(moved<5){const[x,y]=pos(e);select(pick(x,y))}});
cv.addEventListener('pointerleave',()=>{hover=null;tip.style.opacity=0});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.7,Math.min(1.6,zoom*(e.deltaY<0?1.06:.94)))},{passive:false});
function select(c){sel=c;if(!c)return;ty=Math.atan2(-c.p[0],c.p[2]);const z1=-c.p[0]*Math.sin(ty)+c.p[2]*Math.cos(ty);tp=Math.atan2(c.p[1],z1)}
const lg=document.getElementById('legend');
for(const r in REG){const n=C.filter(c=>c.r===r).length,b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed','true');b.style.setProperty('--k',REG[r].k);
  b.innerHTML='<i></i><span>'+RN(r)+'</span>';b.onclick=()=>{const v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',v);C.filter(c=>c.r===r).forEach(c=>c.on=v);if(sel&&!sel.on)sel=null};lg.appendChild(b)}
document.getElementById('stats').innerHTML='<span><b>'+D.files+'</b> '+T('script')+'</span><span><b>'+D.nodes.toLocaleString(LANG)+'</b> '+T('elementi')+'</span><span><b>'+D.edges.toLocaleString(LANG)+'</b> '+T('relazioni')+'</span>';
document.getElementById('hint').textContent=T('hint');
fit();draw(performance.now());if(!reduce)requestAnimationFrame(loop);
</script>

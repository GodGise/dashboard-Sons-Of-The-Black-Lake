<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="media/logo.svg" type="image/svg+xml">
<meta name="color-scheme" content="dark">
<title>Progressi – Obolus Studio</title>
<link rel="stylesheet" href="style.css"></head><body>
<nav id="nav"></nav><div id="pb"></div>

<header class="hero">
  <canvas id="fx"></canvas><div class="blob"></div>
  <p class="eyebrow">Progressi</p>
  <h1><span class="grad">Il lavoro, in diretta.</span></h1>
  <p class="lead">Numeri veri, aggiornati da soli.</p>
  <div class="cd" id="cd"></div>
  <div class="cdl" id="cdl"></div>
</header>

<main id="app">
<section id="capitolo"><div class="rv"><p class="k grad">Capitolo 1</p><h2>Il primo capitolo.</h2><p class="sub">Le tappe del primo capitolo.</p></div>
  <div class="card chap rv"><div class="ring"><svg width="180" height="180" viewBox="0 0 180 180"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a84ff"/><stop offset=".5" stop-color="#bf5af2"/><stop offset="1" stop-color="#ff375f"/></linearGradient></defs><circle cx="90" cy="90" r="76" fill="none" stroke="var(--line)" stroke-width="14"/><circle id="rg" cx="90" cy="90" r="76" fill="none" stroke="url(#gr)" stroke-width="14" stroke-linecap="round" stroke-dasharray="477.5" stroke-dashoffset="477.5" style="transition:stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1)"/></svg><div class="t"><b id="cp">—</b><span>tappe pronte</span></div></div>
  <div><ol class="tl" id="cl"></ol><div class="note" id="cn"></div></div></div>
</section>

<section id="numeri"><div class="rv"><p class="k" style="color:var(--teal)">Il gioco in numeri</p><h2>Quanto abbiamo costruito.</h2></div>
  <div class="tiles rv" id="nums"></div>
  <div class="tiles rv" id="recs" style="margin-top:14px"></div>
</section>

<section id="roadmap"><div class="rv"><p class="k" style="color:var(--purple)">Roadmap</p><h2>Quattro fasi, un gioco.</h2><p class="sub">Date indicative.</p></div><div class="road rv" id="road"></div></section>
</main>
<footer id="ft"></footer>

<script src="i18n.js"></script>
<script src="site.js"></script>
<script>
const {$,f,el}=site;
Promise.all([site.data,site.cfg]).then(([D,C])=>{
    site.countdown(C,$('cd'),$('cdl'));

  /* capitolo */
  const ch=D.chapter||[],dn=ch.filter(x=>x.status==='done').length,SL={done:'✓',doing:'…',todo:''};
  $('cp').textContent=dn+' / '+(ch.length-ch.filter(x=>x.detail).length||ch.length);
  setTimeout(()=>{$('rg').style.strokeDashoffset=477.5*(1-(ch.length?dn/ch.length:0))},300);
  $('cl').replaceChildren(...ch.map(x=>{const li=el('li');li.append(el('span','dot '+x.status,SL[x.status]),el('span','',x.name));if(x.detail)li.append(el('span','mut','· '+x.detail));return li}));
  $('cn').textContent=C.chapter_note||'';

  /* numeri + record */
  const NU=D.numbers||{},R=D.records||{};
  $('nums').replaceChildren(site.tile('Script di gioco',NU.scripts,'var(--blue)','file di codice'),site.tile('Scene',NU.scenes,'var(--purple)','livelli e menu'),site.tile('Modelli 3D',NU.models,'var(--orange)','di Nazar'),site.tile('Audio',NU.audio,'var(--pink)','musiche e suoni'),site.tile('Documenti',NU.docs,'var(--green)','di design e regole'),site.tile('Lingue',C.languages,'var(--teal)','nel gioco'));
  $('recs').replaceChildren(site.tile('Giorni di fila',R.streak,'var(--green)','con almeno un commit'),site.tile('Settimana record',(R.best_week||{}).commits,'var(--blue)','commit · '+(R.best_week&&R.best_week.week?new Date(R.best_week.week+'T12:00:00').toLocaleDateString(site.loc,{day:'numeric',month:'short'}):'')),site.tile('PR unite',R.merged_total,'var(--purple)','in totale'),site.tile('Più PR unite',(R.top_merger||{}).prs,'var(--orange)',''));

  /* roadmap */
  $('road').replaceChildren(...(C.phases||[]).map((p,i)=>{const d=el('div','ph'+(i===C.phase_current?' now':''));d.append(el('div','nn',(i===C.phase_current?'ORA · ':'')+'FASE '+(i+1)),el('b','',p.name),el('div','mut',p.when),el('div','mut',p.what));return d}));
  site.reveal();
}).catch(()=>site.fail());
</script><script src="fx.js"></script></body></html>
